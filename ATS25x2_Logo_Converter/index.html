<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>ATS25x2 RGB565 Converter 265x120</title>

<style>
body{
    font-family:Arial;
    background:#222;
    color:white;
    padding:20px;
}

canvas{
    border:1px solid #555;
    margin-top:15px;
    image-rendering:pixelated;
}

button{
    padding:10px 20px;
    margin-top:15px;
    cursor:pointer;
}

textarea{
    width:100%;
    height:350px;
    margin-top:15px;
    background:#111;
    color:#0f0;
    font-family:Consolas;
}
</style>
</head>

<body>

<h2>Konwerter obrazów → RGB565 (265x120)</h2>

<input type="file" id="file" accept=".jpg,.jpeg,.png,.gif,.bmp,.webp">

<br>

<canvas id="canvas" width="265" height="120"></canvas>

<br>

<button id="download">Pobierz logo.h</button>

<textarea id="output"></textarea>

<script>

const WIDTH=265;
const HEIGHT=120;

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

document.getElementById("file").onchange=e=>{

const file=e.target.files[0];
if(!file) return;

const img=new Image();

img.onload=()=>{

ctx.fillStyle="black";
ctx.fillRect(0,0,WIDTH,HEIGHT);

const scale=Math.min(
WIDTH/img.width,
HEIGHT/img.height
);

const w=img.width*scale;
const h=img.height*scale;

const x=(WIDTH-w)/2;
const y=(HEIGHT-h)/2;

ctx.drawImage(img,x,y,w,h);

convert();

};

img.src=URL.createObjectURL(file);

}

function rgb565(r,g,b){

const rr = g;
const gg = b;
const bb = r;

return ((rr&0xF8)<<8) |
       ((gg&0xFC)<<3) |
       (bb>>3);

}

function convert(){

const img=ctx.getImageData(0,0,WIDTH,HEIGHT);

const d=img.data;

let out=[];

out.push("const unsigned short logo["+(WIDTH*HEIGHT)+"] PROGMEM = {");

let line="";

for(let i=0;i<WIDTH*HEIGHT;i++){

const p=i*4;

const r=d[p];
const g=d[p+1];
const b=d[p+2];

const c=rgb565(r,g,b);

line+="0x"+c.toString(16).toUpperCase().padStart(4,"0");

if(i<WIDTH*HEIGHT-1)
line+=",";

if((i+1)%12==0){

out.push(line);

line="";

}

}

if(line.length)
out.push(line);

out.push("};");

document.getElementById("output").value=out.join("\n");

}

document.getElementById("download").onclick=()=>{

const txt=document.getElementById("output").value;

const blob=new Blob([txt],{type:"text/plain"});

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="logo.h";

a.click();

}

</script>

</body>
</html>
